<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giỏ hàng - PhoneStore</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="bi bi-phone-fill"></i> Phone<span>Store</span></a>
    <div class="ms-auto d-flex gap-2">
      <a href="cart.html" class="nav-link position-relative active"><i class="bi bi-cart3 fs-5"></i><span class="badge bg-danger rounded-pill position-absolute top-0 end-0 cart-badge" style="display:none">0</span></a>
      <div id="navAuth"></div>
    </div>
  </div>
</nav>

<div class="breadcrumb-section">
  <div class="container">
    <nav><ol class="breadcrumb mb-0"><li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Trang chủ</a></li><li class="breadcrumb-item active">Giỏ hàng</li></ol></nav>
  </div>
</div>

<div class="container py-4">
  <h4 class="fw-800 mb-4"><i class="bi bi-cart3 me-2 text-primary"></i>Giỏ hàng của bạn</h4>

  <div id="cartEmpty" style="display:none">
    <div class="empty-state py-5">
      <i class="bi bi-cart-x" style="font-size:5rem;color:#dee2e6"></i>
      <h5 class="mt-3 text-muted">Giỏ hàng trống</h5>
      <p class="text-muted">Hãy thêm sản phẩm vào giỏ hàng</p>
      <a href="index.html" class="btn btn-primary px-4"><i class="bi bi-arrow-left me-2"></i>Tiếp tục mua sắm</a>
    </div>
  </div>

  <div id="cartContent" style="display:none">
    <div class="row g-4">
      <div class="col-lg-8">
        <!-- SELECT ALL -->
        <div class="d-flex align-items-center justify-content-between bg-white rounded-3 p-3 mb-2 shadow-sm">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="selectAll" onchange="toggleSelectAll(this)">
            <label class="form-check-label fw-600" for="selectAll">Chọn tất cả (<span id="totalCount">0</span> sản phẩm)</label>
          </div>
          <button class="btn btn-sm btn-outline-danger" onclick="deleteSelected()"><i class="bi bi-trash me-1"></i>Xóa đã chọn</button>
        </div>
        <div id="cartItems"></div>
      </div>

      <div class="col-lg-4">
        <div class="order-summary sticky-top" style="top:80px">
          <h6 class="fw-700 mb-3">Tóm tắt đơn hàng</h6>

          <!-- COUPON -->
          <div class="mb-3">
            <label class="form-label fw-600 small">Mã giảm giá</label>
            <div class="input-group">
              <input type="text" id="couponInput" class="form-control" placeholder="Nhập mã...">
              <button class="btn btn-outline-primary" onclick="applyCoupon()">Áp dụng</button>
            </div>
            <div id="couponMsg" class="small mt-1"></div>
          </div>
          <hr>

          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Tạm tính (<span id="selectedCount">0</span> sản phẩm)</span>
            <span id="subtotalDisplay">0 ₫</span>
          </div>
          <div class="d-flex justify-content-between mb-2" id="discountRow" style="display:none!important">
            <span class="text-success">Giảm giá</span>
            <span class="text-success" id="discountDisplay">0 ₫</span>
          </div>
          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Phí vận chuyển</span>
            <span id="shippingDisplay"><span class="text-success">Miễn phí</span></span>
          </div>
          <hr>
          <div class="d-flex justify-content-between mb-3">
            <span class="fw-700 fs-5">Tổng cộng</span>
            <span class="fw-800 fs-5 text-danger" id="totalDisplay">0 ₫</span>
          </div>

          <button class="btn btn-danger w-100 py-3 fw-700 fs-6" onclick="proceedCheckout()">
            <i class="bi bi-shield-lock me-2"></i>Tiến hành thanh toán
          </button>
          <a href="index.html" class="btn btn-outline-secondary w-100 mt-2">
            <i class="bi bi-arrow-left me-2"></i>Tiếp tục mua sắm
          </a>

          <div class="mt-3 p-3 bg-light rounded-3">
            <div class="d-flex align-items-center gap-2 small text-muted mb-1"><i class="bi bi-shield-check text-success"></i>Thanh toán bảo mật 100%</div>
            <div class="d-flex align-items-center gap-2 small text-muted mb-1"><i class="bi bi-truck text-primary"></i>Giao hàng toàn quốc</div>
            <div class="d-flex align-items-center gap-2 small text-muted"><i class="bi bi-arrow-repeat text-warning"></i>Đổi trả 30 ngày</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/cart.js"></script>
<script>
let couponDiscount = 0;
const COUPONS = { 'SALE10': 10, 'PHONE20': 20, 'NEWUSER': 15 };
let selected = new Set();

function renderNavAuth() {
  const u = Auth.user();
  const el = document.getElementById('navAuth');
  if (u) el.innerHTML = `<div class="dropdown"><a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown"><i class="bi bi-person-circle"></i></a><ul class="dropdown-menu dropdown-menu-end"><li><a class="dropdown-item" href="profile.html">Tài khoản</a></li><li><a class="dropdown-item" href="orders.html">Đơn hàng</a></li><li><hr class="dropdown-divider"></li><li><a class="dropdown-item" href="#" onclick="Auth.logout()">Đăng xuất</a></li></ul></div>`;
  else el.innerHTML = `<a href="login.html" class="btn btn-outline-light btn-sm">Đăng nhập</a>`;
}

function renderCart() {
  const items = Cart.get();
  document.getElementById('totalCount').textContent = items.length;
  if (!items.length) {
    document.getElementById('cartEmpty').style.display = '';
    document.getElementById('cartContent').style.display = 'none';
    return;
  }
  document.getElementById('cartEmpty').style.display = 'none';
  document.getElementById('cartContent').style.display = '';
  selected = new Set(items.map(i=>i.id));

  document.getElementById('cartItems').innerHTML = items.map(item => `
    <div class="cart-item" id="item_${item.id}">
      <div class="d-flex gap-3 align-items-start">
        <div class="form-check mt-2">
          <input class="form-check-input item-check" type="checkbox" value="${item.id}" id="chk_${item.id}" ${selected.has(item.id)?'checked':''} onchange="toggleSelect(${item.id},this)">
        </div>
        <img src="${item.image || 'images/no-image.svg'}" class="cart-img" alt="${item.name}" onerror="this.src='images/no-image.svg'">
        <div class="flex-grow-1">
          <a href="product-detail.html?id=${item.id}" class="text-decoration-none"><div class="fw-600 mb-1">${item.name}</div></a>
          <div class="text-danger fw-700 mb-2">${Utils.fmt(item.price)}</div>
          <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            <div class="qty-ctrl">
              <button onclick="changeQty(${item.id},-1)">−</button>
              <input type="number" value="${item.qty}" min="1" max="${item.stock}" onchange="setQty(${item.id},this.value)">
              <button onclick="changeQty(${item.id},1)">+</button>
            </div>
            <div class="fw-700 text-dark">${Utils.fmt(item.price * item.qty)}</div>
            <button class="btn btn-sm btn-outline-danger" onclick="removeItem(${item.id})"><i class="bi bi-trash"></i></button>
          </div>
        </div>
      </div>
    </div>
  `).join('');

  updateSummary();
}

function toggleSelect(id, cb) {
  if (cb.checked) selected.add(id); else selected.delete(id);
  const items = Cart.get();
  document.getElementById('selectAll').checked = selected.size === items.length;
  updateSummary();
}

function toggleSelectAll(cb) {
  Cart.get().forEach(i => {
    if (cb.checked) selected.add(i.id); else selected.delete(i.id);
    const chk = document.getElementById(`chk_${i.id}`);
    if (chk) chk.checked = cb.checked;
  });
  updateSummary();
}

function updateSummary() {
  const items = Cart.get().filter(i=>selected.has(i.id));
  const subtotal = items.reduce((s,i)=>s+i.price*i.qty,0);
  const disc = Math.round(subtotal * couponDiscount / 100);
  const total = subtotal - disc;

  document.getElementById('selectedCount').textContent = items.reduce((s,i)=>s+i.qty,0);
  document.getElementById('subtotalDisplay').textContent = Utils.fmt(subtotal);
  document.getElementById('discountDisplay').textContent = '-' + Utils.fmt(disc);
  document.getElementById('discountRow').style.display = disc > 0 ? '' : 'none';
  document.getElementById('totalDisplay').textContent = Utils.fmt(total);
  document.getElementById('shippingDisplay').innerHTML = total > 2000000 ? '<span class="text-success fw-600">Miễn phí</span>' : Utils.fmt(30000);
}

function changeQty(id, delta) {
  const items = Cart.get();
  const item = items.find(i=>i.id===id);
  if (!item) return;
  const newQty = Math.max(1, Math.min(item.stock, item.qty + delta));
  Cart.updateQty(id, newQty);
  renderCart();
}

function setQty(id, val) { Cart.updateQty(id, +val); renderCart(); }

function removeItem(id) {
  if (confirm('Xóa sản phẩm này khỏi giỏ hàng?')) { Cart.remove(id); selected.delete(id); renderCart(); }
}

function deleteSelected() {
  if (!selected.size) { Utils.toast('Chưa chọn sản phẩm nào','info'); return; }
  if (confirm(`Xóa ${selected.size} sản phẩm đã chọn?`)) {
    selected.forEach(id => Cart.remove(id));
    selected.clear();
    renderCart();
  }
}

function applyCoupon() {
  const code = document.getElementById('couponInput').value.trim().toUpperCase();
  const msg = document.getElementById('couponMsg');
  if (COUPONS[code] !== undefined) {
    couponDiscount = COUPONS[code];
    msg.innerHTML = `<span class="text-success"><i class="bi bi-check-circle me-1"></i>Áp dụng thành công! Giảm ${couponDiscount}%</span>`;
    updateSummary();
  } else {
    couponDiscount = 0;
    msg.innerHTML = `<span class="text-danger"><i class="bi bi-x-circle me-1"></i>Mã không hợp lệ</span>`;
    updateSummary();
  }
}

function proceedCheckout() {
  if (!selected.size) { Utils.toast('Vui lòng chọn ít nhất 1 sản phẩm','error'); return; }
  const items = Cart.get().filter(i=>selected.has(i.id));
  sessionStorage.setItem('checkoutItems', JSON.stringify(items));
  sessionStorage.setItem('couponDiscount', couponDiscount);
  window.location.href = 'checkout.html';
}

renderNavAuth();
renderCart();
</script>
</body>
</html>
