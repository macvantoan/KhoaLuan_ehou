<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý danh mục - PhoneStore Admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="admin-wrapper">
  <!-- SIDEBAR -->
  <aside class="admin-sidebar" id="sidebar">
    <div class="sidebar-brand"><i class="bi bi-phone-fill"></i><span>PhoneStore Admin</span></div>
    <nav class="sidebar-menu">
      <div class="sidebar-label">Tổng quan</div>
      <a href="dashboard.html" class="sidebar-link"><i class="bi bi-speedometer2"></i>Dashboard</a>
      <a href="analytics.html" class="sidebar-link"><i class="bi bi-graph-up"></i>Thống kê</a>
      <div class="sidebar-label">Quản lý</div>
      <a href="products.html" class="sidebar-link"><i class="bi bi-phone"></i>Sản phẩm</a>
      <a href="categories.html" class="sidebar-link active"><i class="bi bi-tags"></i>Danh mục</a>
      <a href="orders.html" class="sidebar-link"><i class="bi bi-bag"></i>Đơn hàng<span class="badge bg-danger ms-auto">3</span></a>
      <a href="customers.html" class="sidebar-link"><i class="bi bi-people"></i>Khách hàng</a>
      <div class="sidebar-label">Kho hàng</div>
      <a href="inventory.html" class="sidebar-link"><i class="bi bi-box-seam"></i>Tồn kho</a>
      <div class="sidebar-label">Hệ thống</div>
      <a href="../index.html" class="sidebar-link"><i class="bi bi-house"></i>Xem trang web</a>
      <a href="#" class="sidebar-link" onclick="Auth.logout()"><i class="bi bi-box-arrow-right"></i>Đăng xuất</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-outline-secondary d-lg-none" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="bi bi-list fs-5"></i></button>
        <div class="page-title">Quản lý danh mục</div>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#categoryModal" onclick="openModal()">
        <i class="bi bi-plus-lg me-2"></i>Thêm danh mục
      </button>
    </div>

    <div class="admin-body">
      <div class="admin-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="small text-muted">Tổng <span id="totalCat">0</span> danh mục</div>
          <div class="input-group" style="max-width:280px">
            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" class="form-control border-start-0" id="searchCat" placeholder="Tìm danh mục..." oninput="renderTable()">
          </div>
        </div>
        <div class="table-responsive">
          <table class="data-table w-100">
            <thead>
              <tr>
                <th style="width:60px">STT</th>
                <th>Danh mục</th>
                <th>Slug</th>
                <th>Số sản phẩm</th>
                <th>Trạng thái</th>
                <th style="width:100px">Thao tác</th>
              </tr>
            </thead>
            <tbody id="catTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- CATEGORY MODAL -->
<div class="modal fade" id="categoryModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="catModalTitle">Thêm danh mục mới</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-600">Tên danh mục *</label>
            <input type="text" class="form-control" id="fCatName" placeholder="VD: iPhone" oninput="autoSlug()">
          </div>
          <div class="col-12">
            <label class="form-label fw-600">Slug</label>
            <input type="text" class="form-control" id="fCatSlug" placeholder="vd-tu-dong-tao">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-600">Icon (Bootstrap Icons)</label>
            <div class="input-group">
              <span class="input-group-text" id="iconPreview"><i class="bi bi-tag"></i></span>
              <input type="text" class="form-control" id="fCatIcon" placeholder="bi-phone" oninput="document.getElementById('iconPreview').innerHTML='<i class=\'bi '+this.value+'\'></i>'">
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-600">Thứ tự hiển thị</label>
            <input type="number" class="form-control" id="fCatSort" placeholder="0" min="0">
          </div>
          <div class="col-12">
            <label class="form-label fw-600">Mô tả</label>
            <textarea class="form-control" id="fCatDesc" rows="3" placeholder="Mô tả danh mục..."></textarea>
          </div>
          <div class="col-12">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="fCatActive" checked>
              <label class="form-check-label small" for="fCatActive">Hiển thị danh mục (đang hoạt động)</label>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
        <button class="btn btn-success" onclick="saveCategory()"><i class="bi bi-check-lg me-1"></i>Lưu danh mục</button>
      </div>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM -->
<div class="modal fade" id="deleteCatModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-body text-center py-4">
        <div class="text-danger fs-1 mb-2"><i class="bi bi-trash3-fill"></i></div>
        <h6 class="fw-700">Xác nhận xóa?</h6>
        <p class="text-muted small mb-3" id="deleteCatMsg"></p>
        <div class="d-flex gap-2 justify-content-center">
          <button class="btn btn-secondary btn-sm px-4" data-bs-dismiss="modal">Hủy</button>
          <button class="btn btn-danger btn-sm px-4" onclick="confirmDeleteCategory()">Xóa</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/cart.js"></script>
<script>
if (!Auth.isAdmin()) window.location.href = '../login.html';

function apiErrorMessage(e) {
  try { const j = JSON.parse(e.message); return j.message || e.message; } catch { return e.message; }
}

let categories = [];
let editId = null, deleteId = null;

async function loadCategories() {
  Utils.loading(true);
  try {
    categories = await API.get('/categories?all=true');
  } catch (e) {
    Utils.toast('Không tải được danh mục: ' + apiErrorMessage(e), 'error');
    categories = [];
  } finally {
    Utils.loading(false);
    renderTable();
  }
}

function renderTable() {
  const q = document.getElementById('searchCat').value.toLowerCase();
  const filtered = categories.filter(c => !q || c.name.toLowerCase().includes(q) || (c.slug || '').toLowerCase().includes(q));
  document.getElementById('totalCat').textContent = categories.length;

  document.getElementById('catTbody').innerHTML = filtered.length ? filtered.map((c, i) => `
    <tr>
      <td class="text-muted">${i + 1}</td>
      <td>
        <div class="d-flex align-items-center gap-2">
          <div class="icon-box" style="width:36px;height:36px;background:#e7f3ff"><i class="bi ${c.icon || 'bi-tag'} text-primary"></i></div>
          <div class="fw-600 small">${c.name}</div>
        </div>
      </td>
      <td class="text-muted small">${c.slug || '-'}</td>
      <td>${c.productCount ?? 0}</td>
      <td>${c.isActive ? '<span class="badge bg-success">Đang hiển thị</span>' : '<span class="badge bg-secondary">Đã ẩn</span>'}</td>
      <td>
        <div class="d-flex gap-1">
          <button class="action-btn edit" onclick="editCategory(${c.id})" title="Sửa"><i class="bi bi-pencil"></i></button>
          <button class="action-btn delete" onclick="deleteCategory(${c.id},'${c.name}',${c.productCount ?? 0})" title="Xóa"><i class="bi bi-trash"></i></button>
        </div>
      </td>
    </tr>
  `).join('') : '<tr><td colspan="6" class="text-center text-muted py-4">Không tìm thấy danh mục nào</td></tr>';
}

function autoSlug() {
  if (editId) return; // don't override slug user may have customized on edit
  const name = document.getElementById('fCatName').value;
  document.getElementById('fCatSlug').value = name.trim();
}

function openModal(id = null) {
  editId = id;
  document.getElementById('catModalTitle').textContent = id ? 'Chỉnh sửa danh mục' : 'Thêm danh mục mới';
  document.getElementById('fCatName').value = '';
  document.getElementById('fCatSlug').value = '';
  document.getElementById('fCatIcon').value = '';
  document.getElementById('fCatSort').value = '';
  document.getElementById('fCatDesc').value = '';
  document.getElementById('fCatActive').checked = true;
  document.getElementById('iconPreview').innerHTML = '<i class="bi bi-tag"></i>';

  if (id) {
    const c = categories.find(x => x.id === id);
    if (c) {
      document.getElementById('fCatName').value = c.name || '';
      document.getElementById('fCatSlug').value = c.slug || '';
      document.getElementById('fCatIcon').value = c.icon || '';
      document.getElementById('fCatSort').value = c.sortOrder ?? '';
      document.getElementById('fCatDesc').value = c.description || '';
      document.getElementById('fCatActive').checked = !!c.isActive;
      document.getElementById('iconPreview').innerHTML = `<i class="bi ${c.icon || 'bi-tag'}"></i>`;
    }
  }
}

function editCategory(id) {
  openModal(id);
  new bootstrap.Modal(document.getElementById('categoryModal')).show();
}

async function saveCategory() {
  const name = document.getElementById('fCatName').value.trim();
  if (!name) { Utils.toast('Vui lòng nhập tên danh mục', 'error'); return; }

  const payload = {
    name,
    slug: document.getElementById('fCatSlug').value.trim() || null,
    icon: document.getElementById('fCatIcon').value.trim() || null,
    description: document.getElementById('fCatDesc').value.trim() || null,
    sortOrder: +document.getElementById('fCatSort').value || 0,
    isActive: document.getElementById('fCatActive').checked
  };

  try {
    if (editId) {
      await API.put(`/categories/${editId}`, payload, true);
      Utils.toast('Đã cập nhật danh mục');
    } else {
      await API.post('/categories', payload, true);
      Utils.toast('Đã thêm danh mục mới');
    }
    bootstrap.Modal.getInstance(document.getElementById('categoryModal')).hide();
    await loadCategories();
  } catch (e) {
    Utils.toast('Lưu thất bại: ' + apiErrorMessage(e), 'error');
  }
}

function deleteCategory(id, name, productCount) {
  deleteId = id;
  document.getElementById('deleteCatMsg').textContent = productCount > 0
    ? `Danh mục "${name}" đang có ${productCount} sản phẩm nên không thể xóa. Vui lòng chuyển sản phẩm sang danh mục khác trước.`
    : `Bạn có chắc muốn xóa danh mục "${name}"? Hành động này không thể hoàn tác.`;
  new bootstrap.Modal(document.getElementById('deleteCatModal')).show();
}

async function confirmDeleteCategory() {
  try {
    await API.delete(`/categories/${deleteId}`, true);
    bootstrap.Modal.getInstance(document.getElementById('deleteCatModal')).hide();
    Utils.toast('Đã xóa danh mục', 'info');
    await loadCategories();
  } catch (e) {
    Utils.toast('Xóa thất bại: ' + apiErrorMessage(e), 'error');
  }
}

loadCategories();
</script>
</body>
</html>
