# ===========================
# PHONESTORE APPLICATION CONFIG
# ===========================

# Server
server.port=8080
spring.application.name=phone-store-backend

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/phonestore_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# dialect auto-detected by Spring Boot (don't set here — overridden per profile)
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=PhoneStoreSecretKey2024VeryLongSecretKeyForSecurity123456789
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,null

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads/

# Logging
logging.level.com.phonestore=DEBUG
logging.level.org.springframework.security=WARN

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh
