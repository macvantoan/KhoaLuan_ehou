# ===========================
# H2 IN-MEMORY DATABASE PROFILE
# Run: java -jar app.jar --spring.profiles.active=h2
# ===========================

# H2 datasource (override MySQL from base config)
spring.datasource.url=jdbc:h2:mem:phonestore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Force H2 dialect - disable MySQL settings from base
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=false

# H2 Web Console — http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
