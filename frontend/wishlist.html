<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh sách yêu thích - PhoneStore</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="bi bi-phone-fill"></i> Phone<span>Store</span></a>
    <div class="ms-auto d-flex gap-2">
      <a href="cart.html" class="nav-link position-relative"><i class="bi bi-cart3 fs-5"></i><span class="badge bg-danger rounded-pill position-absolute top-0 end-0 cart-badge" style="display:none">0</span></a>
      <div id="navAuth"></div>
    </div>
  </div>
</nav>

<div class="breadcrumb-section">
  <div class="container"><nav><ol class="breadcrumb mb-0"><li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Trang chủ</a></li><li class="breadcrumb-item active">Yêu thích</li></ol></nav></div>
</div>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-800 mb-0"><i class="bi bi-heart-fill text-danger me-2"></i>Sản phẩm yêu thích</h4>
    <button class="btn btn-outline-danger btn-sm" onclick="clearAll()"><i class="bi bi-trash me-1"></i>Xóa tất cả</button>
  </div>

  <div id="wishlistEmpty" style="display:none">
    <div class="empty-state py-5">
      <i class="bi bi-heart" style="font-size:5rem;color:#dee2e6"></i>
      <h5 class="mt-3 text-muted">Chưa có sản phẩm yêu thích</h5>
      <a href="index.html" class="btn btn-primary mt-2"><i class="bi bi-arrow-left me-2"></i>Khám phá sản phẩm</a>
    </div>
  </div>

  <div id="wishlistGrid" class="row g-3"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/cart.js"></script>
<script>
const ALL_PRODUCTS = [
  { id:1, name:'iPhone 15 Pro Max 256GB', price:34990000, oldPrice:37990000, brand:'iPhone', stock:15, rating:4.8, reviewCount:234, images:['https://cdn2.cellphones.com.vn/x/media/catalog/product/i/p/iphone-15-pro-max.png'], discount:8 },
  { id:2, name:'Samsung Galaxy S24 Ultra 512GB', price:31990000, oldPrice:35990000, brand:'Samsung', stock:8, rating:4.7, reviewCount:189, images:['https://cdn2.cellphones.com.vn/x/media/catalog/product/s/a/samsung-s24-ultra.png'], discount:11 },
  { id:3, name:'iPhone 15 128GB', price:22490000, oldPrice:24990000, brand:'iPhone', stock:20, rating:4.6, reviewCount:312, images:['https://cdn2.cellphones.com.vn/x/media/catalog/product/i/p/iphone-15.png'], discount:10 },
  { id:4, name:'Xiaomi 14 Ultra 512GB', price:29990000, oldPrice:32990000, brand:'Xiaomi', stock:5, rating:4.5, reviewCount:87, images:['https://cdn2.cellphones.com.vn/x/media/catalog/product/x/i/xiaomi-14-ultra.png'], discount:9 },
  { id:5, name:'Samsung Galaxy A55 5G 256GB', price:11490000, oldPrice:12990000, brand:'Samsung', stock:30, rating:4.4, reviewCount:156, images:['https://cdn2.cellphones.com.vn/x/media/catalog/product/s/a/samsung-a55.png'], discount:12 },
];

const wishlist = new Set(JSON.parse(localStorage.getItem('wishlist')||'[]'));

function renderNavAuth() {
  const u = Auth.user();
  const el = document.getElementById('navAuth');
  if (u) el.innerHTML = `<div class="dropdown"><a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown"><i class="bi bi-person-circle"></i></a><ul class="dropdown-menu dropdown-menu-end"><li><a class="dropdown-item" href="profile.html">Tài khoản</a></li><li><hr class="dropdown-divider"></li><li><a class="dropdown-item" href="#" onclick="Auth.logout()">Đăng xuất</a></li></ul></div>`;
  else el.innerHTML = `<a href="login.html" class="btn btn-outline-light btn-sm">Đăng nhập</a>`;
}

function render() {
  const items = ALL_PRODUCTS.filter(p=>wishlist.has(p.id));
  const empty = document.getElementById('wishlistEmpty');
  const grid = document.getElementById('wishlistGrid');

  if (!items.length) { empty.style.display=''; grid.innerHTML=''; return; }
  empty.style.display='none';

  grid.innerHTML = items.map(p=>`
    <div class="col-6 col-md-4 col-xl-3 fade-in" id="wl_${p.id}">
      <div class="product-card h-100">
        ${p.discount?`<span class="discount-badge">-${p.discount}%</span>`:''}
        <a href="product-detail.html?id=${p.id}"><img src="${p.images[0]}" class="card-img-top" style="height:200px;object-fit:contain;padding:16px;background:#fafafa" onerror="this.src='images/no-image.svg'" alt="${p.name}"></a>
        <div class="card-body d-flex flex-column">
          <a href="product-detail.html?id=${p.id}" class="text-decoration-none"><div class="product-name mb-1">${p.name}</div></a>
          <div class="d-flex align-items-center gap-1 mb-1"><div class="stars">${Utils.stars(p.rating)}</div><span class="review-count">(${p.reviewCount})</span></div>
          <div class="product-price">${Utils.fmt(p.price)}</div>
          ${p.oldPrice?`<div class="product-old-price">${Utils.fmt(p.oldPrice)}</div>`:''}
          <div class="d-flex gap-1 mt-auto pt-2">
            <button class="btn btn-primary btn-sm flex-grow-1" onclick="Cart.add({id:${p.id},name:'${p.name.replace(/'/g,"\\'")}',price:${p.price},images:['${p.images[0]}'],stock:${p.stock}})">
              <i class="bi bi-cart-plus me-1"></i>Thêm giỏ
            </button>
            <button class="btn btn-outline-danger btn-sm" onclick="removeFromWishlist(${p.id})" title="Xóa">
              <i class="bi bi-heart-fill"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

function removeFromWishlist(id) {
  wishlist.delete(id);
  localStorage.setItem('wishlist', JSON.stringify([...wishlist]));
  document.getElementById(`wl_${id}`)?.remove();
  Utils.toast('Đã xóa khỏi yêu thích', 'info');
  if (!wishlist.size) { document.getElementById('wishlistEmpty').style.display=''; document.getElementById('wishlistGrid').innerHTML=''; }
}

function clearAll() {
  if (!wishlist.size || !confirm('Xóa tất cả sản phẩm yêu thích?')) return;
  wishlist.clear();
  localStorage.setItem('wishlist', '[]');
  render();
  Utils.toast('Đã xóa tất cả yêu thích', 'info');
}

renderNavAuth();
render();
</script>
</body>
</html>
