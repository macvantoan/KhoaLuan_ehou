<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập - PhoneStore</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
.auth-wrapper { min-height: 100vh; display: flex; align-items: center; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }
.auth-card { background: white; border-radius: 20px; padding: 40px; max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.auth-logo { font-size: 1.8rem; font-weight: 800; color: var(--dark); }
.auth-logo span { color: var(--primary); }
.social-btn { border: 1.5px solid #dee2e6; border-radius: 10px; padding: 10px; background: white; cursor: pointer; transition: all 0.2s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; }
.social-btn:hover { background: #f8f9fa; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--secondary); font-size: 0.85rem; }
.divider::before, .divider::after { content: ''; flex: 1; border-top: 1px solid #dee2e6; }
.form-label { font-size: 0.85rem; font-weight: 600; }
.form-control { border-radius: 10px; padding: 10px 14px; border: 1.5px solid #dee2e6; }
.form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(13,110,253,0.1); }
.btn-submit { border-radius: 10px; padding: 12px; font-weight: 700; font-size: 1rem; }
.password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); border: none; background: none; color: var(--secondary); cursor: pointer; }
</style>
</head>
<body>
<div class="auth-wrapper">
  <div class="container">
    <div class="d-flex justify-content-center">
      <div class="auth-card">
        <div class="text-center mb-4">
          <div class="auth-logo mb-1"><i class="bi bi-phone-fill me-1"></i>Phone<span>Store</span></div>
          <h5 class="fw-700 mt-2">Chào mừng trở lại!</h5>
          <p class="text-muted small">Đăng nhập để tiếp tục mua sắm</p>
        </div>

        <!-- SOCIAL LOGIN -->
        <button class="social-btn mb-2" onclick="socialLogin('google')">
          <img src="https://img.icons8.com/color/20/google-logo.png" alt="Google">
          Tiếp tục với Google
        </button>
        <button class="social-btn mb-3" onclick="socialLogin('facebook')">
          <img src="https://img.icons8.com/color/20/facebook.png" alt="Facebook">
          Tiếp tục với Facebook
        </button>

        <div class="divider mb-3">hoặc đăng nhập với email</div>

        <form onsubmit="handleLogin(event)">
          <div class="mb-3">
            <label class="form-label">Email hoặc tên đăng nhập</label>
            <input type="text" id="username" class="form-control" placeholder="email@example.com" required>
          </div>
          <div class="mb-3 position-relative">
            <label class="form-label">Mật khẩu</label>
            <input type="password" id="password" class="form-control pe-5" placeholder="Nhập mật khẩu" required>
            <button type="button" class="password-toggle" onclick="togglePass('password',this)"><i class="bi bi-eye"></i></button>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember">
              <label class="form-check-label small" for="remember">Ghi nhớ đăng nhập</label>
            </div>
            <a href="forgot-password.html" class="text-primary small text-decoration-none">Quên mật khẩu?</a>
          </div>

          <div id="loginError" class="alert alert-danger d-none small py-2 mb-3"></div>

          <button type="submit" class="btn btn-primary w-100 btn-submit" id="loginBtn">
            <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
          </button>
        </form>

        <div class="text-center mt-3">
          <span class="text-muted small">Chưa có tài khoản? </span>
          <a href="register.html" class="text-primary fw-600 text-decoration-none">Đăng ký ngay</a>
        </div>

        <div class="text-center mt-2">
          <a href="index.html" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Quay về trang chủ</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/cart.js"></script>
<script>
if (Auth.isLoggedIn()) window.location.href = 'index.html';

function togglePass(id, btn) {
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.innerHTML = inp.type === 'password' ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang đăng nhập...';
  errEl.classList.add('d-none');

  try {
    const data = await API.post('/auth/login', {
      username: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value
    });
    if (data?.token) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      const redirect = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
      window.location.href = redirect;
    }
  } catch (err) {
    // DEMO: allow test login
    const testUsers = [
      { username:'admin', password:'admin123', user:{ id:1, username:'admin', fullName:'Quản trị viên', email:'admin@phonestore.vn', role:'ADMIN' }, token:'demo_admin_token' },
      { username:'user', password:'user123', user:{ id:2, username:'user', fullName:'Nguyễn Văn A', email:'user@phonestore.vn', role:'USER' }, token:'demo_user_token' },
    ];
    const uname = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;
    const found = testUsers.find(u => (u.username===uname || u.user.email===uname) && u.password===pass);
    if (found) {
      localStorage.setItem('token', found.token);
      localStorage.setItem('user', JSON.stringify(found.user));
      const redirect = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
      window.location.href = redirect;
    } else {
      errEl.textContent = 'Tên đăng nhập hoặc mật khẩu không đúng';
      errEl.classList.remove('d-none');
    }
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập';
}

function socialLogin(provider) {
  alert(`Demo: Đăng nhập bằng ${provider} sẽ được tích hợp với OAuth2 trong backend Java`);
}
</script>
</body>
</html>
